name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: build, vet, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: go mod download
        run: go mod download

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v1.64.8
          args: --timeout=5m

      - name: unit tests
        run: go test ./... -count=1 -race -coverprofile=coverage.out -covermode=atomic

      - name: build
        run: go build ./...

  docs-check:
    name: tfplugindocs sync check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: regenerate docs
        run: go tool tfplugindocs generate --provider-name smplkit

      - name: check for drift
        run: |
          if ! git diff --exit-code -- docs/; then
            echo "::error::Committed docs/ are out of date. Run 'make docs' locally and commit the result."
            exit 1
          fi
