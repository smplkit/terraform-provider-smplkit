name: dependabot-auto-merge

# Auto-merges Dependabot PRs that bump github.com/smplkit/go-sdk/v3
# by a patch or minor version. Everything else Dependabot opens —
# major go-sdk bumps, terraform-plugin-framework updates, GitHub
# Actions updates, etc. — is left as a PR for Mike to review.
#
# Rationale: an SDK patch/minor bump is supposed to be backward
# compatible per semver; the provider's own CI (`ci.yml`) gates the
# merge by running build/vet/lint/unit tests on the PR. Acceptance
# tests don't run on PRs (the IAM role's trust policy is locked to
# refs/heads/main), so the gate is the unit-level suite — which is
# enough for "does the bumped SDK still compile against our wrapper."
# True breakage will surface at the next push-to-main acceptance run.

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: auto-merge go-sdk patch/minor bumps
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: enable auto-merge for go-sdk patch/minor bumps
        if: >
          steps.meta.outputs.dependency-names == 'github.com/smplkit/go-sdk/v3'
          && contains(fromJSON('["version-update:semver-patch","version-update:semver-minor"]'), steps.meta.outputs.update-type)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          # `--auto` waits for required status checks before merging.
          # If the repo doesn't have auto-merge enabled in its
          # settings (Settings → General → Pull Requests → Allow
          # auto-merge), `--auto` fails and we fall through to an
          # immediate merge. Same pattern the org's existing
          # update-sdk composite action uses for the 6 language SDK
          # regen PRs.
          gh pr merge "$PR_URL" --auto --squash ||
            gh pr merge "$PR_URL" --squash
