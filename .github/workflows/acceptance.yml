name: acceptance

# The acceptance suite runs the provider against a real smplkit
# backend stack standing up on the runner via docker-compose. The
# trust policy on the IAM role assumed below is locked to this branch
# (`refs/heads/main`), so PRs — including same-repo PRs — can't run
# this job. Use `make testacc` locally for PR-level validation; this
# job is the post-merge gate.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # required for the OIDC token exchange with AWS
  contents: read

concurrency:
  group: acceptance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  acceptance:
    name: terraform acceptance tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AWS_REGION: us-east-1
      SMPLKIT_API_URL: http://localhost
      APP_AUTH_SECRET: dev-secret
      # The public, well-known dev bypass token (defined in
      # python-core's smplcore.rate_limit). Lets the bootstrap step
      # POST /api/v1/auth/register without burning into the 5/hour
      # limit when CI re-runs.
      SMPLKIT_RATE_LIMIT_BYPASS_TOKEN: "7f3e9a2b-1c4d-4e8f-b6a5-9d0e2f8c7b3a"
      SMOKE_BASE_URL: http://app.localhost
    steps:
      - uses: actions/checkout@v4
        with:
          path: provider

      - uses: actions/checkout@v4
        with:
          repository: smplkit/.github
          path: dot-github

      - name: configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_CI }}
          aws-region: ${{ env.AWS_REGION }}

      - name: log in to ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "299349364328.dkr.ecr.${AWS_REGION}.amazonaws.com"

      - name: pull platform images
        working-directory: dot-github/platform
        run: docker compose -f docker-compose.ci.yml pull

      - name: start postgres
        working-directory: dot-github/platform
        run: |
          docker compose -f docker-compose.ci.yml up -d postgres
          # The healthcheck declared in the compose file is what
          # `service_healthy` waits on; surface its status here so a
          # postgres-side failure is visible early in the log.
          for i in {1..30}; do
            if docker compose -f docker-compose.ci.yml ps postgres --format json \
                | grep -q '"Health":"healthy"'; then
              echo "postgres is healthy"
              break
            fi
            sleep 2
          done

      - name: run alembic migrations
        working-directory: dot-github/platform
        run: |
          for svc in app config flags logging audit; do
            echo "::group::alembic upgrade head on ${svc}"
            docker compose -f docker-compose.ci.yml run --rm --entrypoint "" "$svc" alembic upgrade head
            echo "::endgroup::"
          done

      - name: start platform services
        working-directory: dot-github/platform
        run: docker compose -f docker-compose.ci.yml up -d

      - name: wait for platform liveness
        run: ./provider/scripts/wait_for_platform.sh

      - name: bootstrap account + API key
        id: bootstrap
        run: python3 provider/scripts/smoke_bootstrap.py

      - name: setup go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
          cache-dependency-path: provider/go.sum

      - name: run acceptance tests
        working-directory: provider
        env:
          SMPLKIT_API_KEY: ${{ steps.bootstrap.outputs.SMPLKIT_API_KEY }}
          TF_ACC: "1"
        run: go test ./internal/provider/... -v -timeout 20m -run '^TestAcc' -count=1

      - name: dump platform logs on failure
        if: failure()
        working-directory: dot-github/platform
        run: |
          for svc in postgres caddy app config flags logging audit; do
            echo "::group::logs for ${svc}"
            docker compose -f docker-compose.ci.yml logs --tail=200 "$svc" || true
            echo "::endgroup::"
          done

      - name: tear down platform
        if: always()
        working-directory: dot-github/platform
        run: docker compose -f docker-compose.ci.yml down -v --remove-orphans || true
