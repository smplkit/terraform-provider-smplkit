name: smoke

# Triggered after the release workflow completes so the
# just-published provider is exercised end-to-end against production.
# `workflow_run` doesn't suffer the GITHUB_TOKEN-can't-trigger
# limitation that `release: published` does when the release was cut
# by goreleaser inside another workflow.
on:
  workflow_run:
    workflows: ["release"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Provider version to install (e.g. 0.1.0)"
        required: true

permissions:
  contents: read

jobs:
  smoke:
    name: terraform apply against production
    # When triggered by workflow_run, only proceed if the upstream
    # release succeeded — a failed release run leaves no artifact to
    # smoke against.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SMOKE_BASE_URL: https://app.smplkit.com
      APP_AUTH_SECRET: ${{ secrets.APP_AUTH_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run defaults to the workflow file's branch, not the
          # commit that produced the release — explicitly check out the
          # commit that triggered the upstream run so the smoke
          # Terraform pinned at the right provider version matches the
          # release content.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: resolve provider version
        id: ver
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            v="${{ github.event.inputs.version }}"
          else
            # Latest published release on the repo. The release workflow
            # ran immediately before this one; its tag is what we test.
            v=$(/usr/bin/curl -sH "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/releases/latest" \
              | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["tag_name"].lstrip("v"))')
          fi
          if [[ -z "$v" ]]; then
            echo "::error::could not determine smoke version"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Smoke-testing provider v$v"

      - name: pin provider version in smoke config
        run: |
          sed -i 's|version *= *">=.*"|version = "= ${{ steps.ver.outputs.version }}"|' scripts/smoke/main.tf
          grep "version =" scripts/smoke/main.tf

      - name: bootstrap ephemeral account
        id: bootstrap
        run: python3 scripts/smoke_bootstrap.py

      - name: terraform init
        working-directory: scripts/smoke
        env:
          SMPLKIT_API_KEY: ${{ steps.bootstrap.outputs.SMPLKIT_API_KEY }}
        run: terraform init -input=false

      - name: terraform apply
        working-directory: scripts/smoke
        env:
          SMPLKIT_API_KEY: ${{ steps.bootstrap.outputs.SMPLKIT_API_KEY }}
          TF_VAR_smoke_nonce: ${{ github.run_id }}-${{ github.run_attempt }}
        run: terraform apply -auto-approve -input=false

      - name: terraform plan (drift check)
        working-directory: scripts/smoke
        env:
          SMPLKIT_API_KEY: ${{ steps.bootstrap.outputs.SMPLKIT_API_KEY }}
          TF_VAR_smoke_nonce: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          terraform plan -detailed-exitcode -input=false
          # exit code 0 = no changes (good); 2 = changes detected (drift)

      - name: terraform destroy
        if: always()
        working-directory: scripts/smoke
        env:
          SMPLKIT_API_KEY: ${{ steps.bootstrap.outputs.SMPLKIT_API_KEY }}
          TF_VAR_smoke_nonce: ${{ github.run_id }}-${{ github.run_attempt }}
        run: terraform destroy -auto-approve -input=false || true

      - name: delete ephemeral account
        if: always()
        env:
          ACCOUNT_TOKEN: ${{ steps.bootstrap.outputs.ACCOUNT_TOKEN }}
        run: python3 scripts/smoke_teardown.py
